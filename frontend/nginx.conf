# 深度研搜前端 Nginx 配置
#
# 承担三件事：
#   1. 托管静态资源 + SPA fallback（刷新不 404）
#   2. 反代 /api 到后端容器（避免浏览器跨域，走容器内部网络）
#   3. 反代 /ws 到后端容器 —— WebSocket 是本项目与电商问数最大的差异，
#      进度推送、任务状态全靠它，配置缺一不可
#
# 注意：前端代码里 API_BASE_URL 默认是 http://localhost:8000，
# 但走 Nginx 同源反代时不应再用绝对地址。容器模式下前端与后端同源
# （都从 5173→Nginx:80 进入），因此由 vite 构建产物使用相对路径最稳。
# 见 frontend/.env.example 中对 VITE_API_BASE_URL 的说明。

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Docker 内嵌 DNS。127.0.0.11 固定，用于运行时解析服务名。
    # 为什么必须运行时解析：nginx 默认在「启动时」把 upstream 主机名解析并
    # 固化，若那一刻 backend 尚未在 Docker DNS 中注册，nginx 会直接
    #   [emerg] host not found in upstream "backend"
    # 退出并陷入重启循环。用变量形式的 proxy_pass 可把解析推迟到每次请求，
    # 从而让前端容器不依赖上游是否已就绪。
    resolver 127.0.0.11 valid=10s ipv6=off;

    # 后端服务名。定义成变量是为了配合上面的 resolver 走运行时解析。
    set $backend_upstream "backend";

    # 上传接口可传 50 MB 文件（与后端 MAX_UPLOAD_SIZE 一致），
    # Nginx 默认 1 MB 会先于后端把请求拒掉
    client_max_body_size 50m;

    # SPA fallback：找不到文件就交给 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 后端 HTTP 接口反代
    location /api/ {
        # 保留 /api 前缀：后端路由本身即以 /api 开头
        # 用变量 + resolver 做运行时解析，避免启动期 upstream 解析失败
        proxy_pass http://$backend_upstream:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 研搜任务耗时长（多轮 LLM + 网络检索），放宽超时
        proxy_read_timeout 600s;
        proxy_connect_timeout 15s;
        proxy_send_timeout 600s;

        # 流式响应：关闭缓冲，否则事件会被 Nginx 攒着一起发
        proxy_buffering off;
        proxy_cache off;
    }

    # WebSocket 反代：进度推送的核心通道
    location /ws/ {
        # 同样用变量 + resolver 做运行时解析
        proxy_pass http://$backend_upstream:8001;
        proxy_http_version 1.1;

        # 这三行是 WebSocket 升级握手成功的关键，缺任一行连接都会 400/断连
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # WebSocket 是长连接，读超时给足，否则空闲一会儿就被切断
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        # WebSocket 必须关闭缓冲
        proxy_buffering off;
        proxy_cache off;
    }
}
